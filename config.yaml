# VoiceBridge AI — central configuration
# All tunable values live here, not in Python constants.

app:
  name: "VoiceBridge AI"
  # Directory (relative to project root) for temporary audio chunks.
  temp_chunk_dir: "temp_chunks"
  # Directory for generated TTS + lip-synced output.
  output_dir: "generated_speech"

feature_flags:
  enable_pipeline_contracts: true
  enable_new_interfaces: true
  enable_tracing: true
  enable_streaming: true
  enable_async_pipeline: true
  enable_backpressure: true
  enable_model_warmup: true
  enable_intelligent_routing: true
  enable_fallback_chains: true
  enable_circuit_breaker: true
  enable_rate_limiting: true

routing:
  default_tier: "balanced"  # fast | balanced | high_quality
  latency_budget_ms: 1500.0

resilience:
  circuit_breaker:
    failure_threshold: 3
    recovery_timeout_sec: 10.0
  rate_limiter:
    requests_per_second: 50.0
    burst_capacity: 100

pipeline:
  queue_sizes:
    vad: 20
    stt: 10
    llm: 10
    tts: 10
    playback: 20

# AI Model directories (no hardcoded absolute paths)
models:
  root_dir: "models"
  whisper_dir: "models/whisper"
  nllb_dir: "models/nllb"
  wav2lip_dir: "models/wav2lip"

# Cache configuration to reduce translation & TTS latency
cache:
  enabled: true
  dir: "cache"
  translation_dir: "cache/translation"
  audio_dir: "cache/audio"
  ttl_seconds: 86400

# Avatar management module configuration
avatar:
  dir: "voicebridge/avatar"
  images_dir: "voicebridge/avatar/images"
  videos_dir: "voicebridge/avatar/videos"
  default_avatar: "speaker"
  source_face: "assets/faces/speaker.mp4"

logging:
  # DEBUG | INFO | WARNING | ERROR
  level: "INFO"
  # If set, also write logs to this file (relative to project root). null = console only.
  file: "logs/voicebridge.log"

audio:
  sample_rate: 16000
  channels: 1
  # Fallback fixed-chunk length (seconds) used only when VAD is disabled.
  chunk_seconds: 4
  playback:
    # blocking playback (old playsound behaviour) or non-blocking streamed playback.
    non_blocking: true
  vad:
    enabled: true
    # Silero VAD (bundled with faster-whisper) parameters.
    min_silence_duration_ms: 300
    # Emit a segment once this much speech has accumulated even without a pause.
    max_segment_seconds: 4
    # Minimum speech before a segment is worth transcribing.
    min_segment_seconds: 0.4

stt:
  # Active provider: "faster-whisper", "whisper-api", or "vosk"
  provider: "faster-whisper"
  # Preferred device order; first that loads wins.
  device_preference: ["cuda", "cpu"]
  cuda:
    model_size: "base"
    compute_type: "float16"
  cpu:
    model_size: "base"
    compute_type: "int8"

  transcribe:
    beam_size: 5
    temperature: 0.0
    condition_on_previous_text: false
    no_speech_threshold: 0.6
    log_prob_threshold: -1.0
    compression_ratio_threshold: 2.4
    vad_filter: true
    vad_min_silence_duration_ms: 300
  # Confidence guards to drop silence hallucinations.
  reliability:
    max_no_speech_prob: 0.60
    min_avg_logprob: -1.5
    max_compression_ratio: 2.8

buffer:
  # Send text to translation when: sentence-ending punctuation appears,
  # the buffer reaches the word limit, or the speaker pauses for the timeout.
  word_limit: 5
  timeout_seconds: 1.5
  sentence_endings: [".", "?", "!", "؟", "۔", "।"]
  noise_phrases:
    - "thanks"
    - "thank you"
    - "thank you so much"
    - "thank you very much"
    - "thanks for watching"
    - "thank you for watching"
    - "please subscribe"
    - "subscribe"
    - "subtitles"
    - "subtitles by"
    - "translated by"
    - "amara org"
    - "bye"

translation:
  # Active primary provider (or backends fallback chain)
  provider: "google"
  # Ordered list of backends to try. First success wins.
  # Preferred fallback order: Google (online) -> Meta NLLB-200 (offline) -> Argos (offline fallback).
  backends: ["google", "nllb", "argos"]
  urdu_postprocessor:
    enabled: true
  nllb:
    model_name: "facebook/nllb-200-distilled-600M"
    device: "cpu"
  retry:
    max_attempts: 3
    base_delay_seconds: 0.5
    max_delay_seconds: 4.0

tts:
  # Active provider: "edge-tts" (Microsoft Neural TTS) or "coqui"
  provider: "edge-tts"
  # output format.

  output_format: "mp3"

lipsync:
  # Active provider: "wav2lip", "buffered", "demo", or "null"
  provider: "wav2lip"
  # Backend fallback alias compatibility: "demo", "buffered", "wav2lip", or "null"
  backend: "demo"
  # Source face video/image for the talking head (relative to project root).
  source_face: "assets/faces/speaker.mp4"
  wav2lip:
    checkpoint: "models/wav2lip/wav2lip_gan.pth"
    batch_size: 16
    fps: 25
  buffered:
    # Path to the Wav2Lip checkpoint (user must download).
    checkpoint: "models/wav2lip/wav2lip_gan.pth"
    # Wav2Lip inference batch size (lower = less RAM on CPU).
    batch_size: 16
    fps: 25
  demo:
    # Pre-rendered lip-synced clip played back in demo mode.
    prerendered_dir: "assets/prerendered"

api:
  host: "127.0.0.1"
  port: 8000
  # Serves the two-participant meeting UI + WebSocket event stream.

metrics:
  enabled: true
  sample_interval_sec: 0.5
  json_log_path: "logs/performance.jsonl"
  report_dir: "logs/reports"
  dashboard:
    refresh_rate_sec: 0.5

# Supported languages. Keyed by short id; add more freely.
# translation_code = ISO code for NMT; edge_voice = edge-tts voice.
languages:
  en:
    display_name: "English"
    translation_code: "en"
    edge_voice: "en-US-JennyNeural"
    nllb_code: "eng_Latn"
  ar:
    display_name: "Arabic"
    translation_code: "ar"
    edge_voice: "ar-SA-ZariyahNeural"
    nllb_code: "arb_Arab"
  ur:
    display_name: "Urdu"
    translation_code: "ur"
    edge_voice: "ur-PK-UzmaNeural"
    nllb_code: "urd_Arab"
  hi:
    display_name: "Hindi"
    translation_code: "hi"
    edge_voice: "hi-IN-SwaraNeural"
    nllb_code: "hin_Deva"
  fr:
    display_name: "French"
    translation_code: "fr"
    edge_voice: "fr-FR-DeniseNeural"
    nllb_code: "fra_Latn"
  es:
    display_name: "Spanish"
    translation_code: "es"
    edge_voice: "es-ES-ElviraNeural"
    nllb_code: "spa_Latn"

# Default demo pairing (English <-> Arabic).
defaults:
  my_language: "en"
  other_language: "ar"
